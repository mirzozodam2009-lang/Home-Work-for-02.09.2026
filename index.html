
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./src/output.css" rel="stylesheet">
</head>
<body>
  <section class="relative">
  <img src="./background.png" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0 bg-gray-700/40 md:hidden"></div>

  <div class="relative max-w-7xl mx-auto px-6 md:px-8 py-6 md:py-8 flex items-center justify-between">
    <span class="text-white text-lg md:text-xl font-bold">Physionic</span>
    <div class="hidden md:flex gap-8 text-sm text-white">
      <span>Home</span>
      <span>Product</span>
      <span>Pricing</span>
      <span>Contact</span>
    </div>
    <div class="flex md:hidden items-center gap-4 text-white">
      <span>🔍</span>
      <span>🛒</span>
      <span>☰</span>
    </div>
    <button class="hidden md:flex bg-sky-500 text-white text-sm px-6 py-3 rounded-lg items-center gap-2">
      Get Quote Now <span>→</span>
    </button>
  </div>

  <div class="flex md:hidden flex-col items-center gap-6 relative pb-8 text-white text-base">
    <span>Home</span>
    <span>Product</span>
    <span>Pricing</span>
    <span>Contact</span>
  </div>

  <div class="relative max-w-7xl mx-auto px-6 md:px-8 grid md:grid-cols-2 gap-6 md:gap-10 items-center pb-20">
    <div class="text-center md:text-left md:pt-10">
      <h1 class="text-3xl md:text-5xl font-bold text-white leading-tight mb-4 md:mb-6">
        Meet the Best Hospital
      </h1>
      <p class="text-gray-200 text-sm md:text-base mb-6 md:mb-8">
        We know how large objects will act,<br>but things on a small scale.
      </p>
      <div class="flex flex-col md:flex-row items-center justify-center md:justify-start gap-3 md:gap-4">
        <button class="bg-[#23a6f0] text-white px-6 py-3 rounded-full text-sm w-full md:w-auto">
          Get Quote Now
        </button>
        <button class="border border-white text-white px-6 py-3 rounded-full text-sm w-full md:w-auto">
          Learn More
        </button>
      </div>
    </div>

    <div class="bg-white rounded-1xl p-10 md:p-8 md:w-80 md:ml-50 -mb-24 md:mb-0">
      <h2 class="text-lg md:text-xl font-bold text-gray-900 mb-5 md:mb-6">Book Appointment</h2>
      <label class="block text-sm text-gray-700 mb-2">Name *</label>
      <input type="text" placeholder="Full Name *" class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm mb-5 outline-none">
      <label class="block text-sm text-gray-700 mb-2">Email address *</label>
      <input type="email" placeholder="example@gmail.com" class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm mb-5 outline-none">
      <label class="block text-sm text-gray-700 mb-2">Departement *</label>
      <select class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm mb-5 outline-none text-gray-400">
        <option>Please Select</option>
      </select>
      <label class="block text-sm text-gray-700 mb-2">Time *</label>
      <select class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm mb-6 outline-none text-gray-400">
        <option>4:00 Available</option>
      </select>

      <button class="w-full bg-sky-500 text-white py-3 rounded-lg text-sm font-medium">
        Book Appointment
      </button>
    </div>
  </div>
</section>


</body>
</html>
